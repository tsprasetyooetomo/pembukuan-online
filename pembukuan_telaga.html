<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Sistem Pembukuan — Supabase</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dbf-reader@1.1.0/dist/dbf-reader.min.js"></script>

    <style>
      .sb-hd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .sb-hd-title {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-weight: 700;
        font-size: 1rem;
      }
      .sb-toggle-btn {
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: #fff;
        width: 28px;
        height: 28px;
        border-radius: 5px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
      }
      .sb-toggle-btn:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .sb {
        transition: margin-left 0.3s ease;
      }

      .main {
        transition: margin-left 0.3s ease;
      }
      .sidebar.hidden-menu + .main {
        margin-left: 0 !important;
      }

      /* Container Login dengan Gaya Digital Lock */
      .login-container {
        padding: 20px;
        max-width: 320px;
        margin: 40px auto;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        display: none;
      }
      .login-container input[type="text"] {
        width: 100%;
        margin-bottom: 4px;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 0.9rem;
      }
      .login-container button:not(.lock-key) {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #fff;
        border: none;
        cursor: pointer;
        border-radius: 6px;
        font-size: 0.9rem;
        transition: opacity 0.2s;
      }
      .login-container button:not(.lock-key):hover {
        opacity: 0.9;
      }

      /* Styling Keypad Digital Lock */
      .lock-key {
        background: #f3f4f6;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        padding: 12px 0;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.15s ease;
        color: #1f2937;
      }
      .lock-key:hover {
        background: #e5e7eb;
        border-color: #9ca3af;
      }
      .lock-key:active {
        background: #d1d5db;
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>
    <div class="bg-g"></div>
    <div class="toast-box" id="toasts"></div>

    <aside class="sb" id="sidebar">
      <div class="sb-hd">
        <div class="sb-hd-title">
          <i class="fa-solid fa-book-open"></i><span>Pembukuan-Kasir</span>
        </div>
        <button
          type="button"
          class="sb-toggle-btn"
          id="btnToggleMenu"
          title="Sembunyikan Menu"
        >
          <i class="fa-solid fa-angles-left"></i>
        </button>
      </div>
      <div class="sb-body" id="sbBody"></div>
      <div class="sb-ft"><span class="db-dot"></span> Supabase Connected</div>
    </aside>

    <div class="main">
      <div class="top-bar">
        <div style="display: flex; align-items: center; gap: 0.6rem">
          <button type="button" class="mob-toggle" id="btnHamburger">
            <i class="fas fa-bars"></i>
          </button>
          <button
            onclick="refreshApp()"
            style="
              background: rgba(255, 255, 255, 0.1);
              border: none;
              color: #fff;
              width: 32px;
              height: 32px;
              border-radius: 4px;
              cursor: pointer;
              display: flex;
              align-items: center;
              justify-content: center;
            "
            title="Refresh Data"
          >
            <i class="fa-solid fa-rotate-right"></i>
          </button>
          <div class="tb-title" id="tbTitle">
            <i class="fa-solid fa-database"></i> Memuat...
          </div>
        </div>
        <div class="tb-actions">
          <span
            style="
              font-size: 0.7rem;
              color: var(--muted);
              font-family: &quot;JetBrains Mono&quot;, monospace;
            "
            id="clockEl"
          ></span>
          <button
            id="btnLogout"
            onclick="doLogout()"
            style="
              background: #dc2626;
              border: none;
              color: #fff;
              padding: 6px 12px;
              border-radius: 4px;
              cursor: pointer;
              font-size: 0.75rem;
            "
            title="Logout"
          >
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </button>
        </div>
      </div>

      <div class="content" id="contentArea" style="position: relative">
        <div class="loading-ov" id="loadingOv">
          <span><span class="spinner"></span> Membuka database...</span>
        </div>

        <!-- Box Login Interaktif & Digital Lock -->
        <div class="login-container" id="loginBox">
          <div style="text-align: center; margin-bottom: 15px">
            <i
              class="fa-solid fa-shield-halved"
              style="font-size: 2rem; color: #2563eb"
            ></i>
            <h3 style="color: #1e293b; margin-top: 5px; font-size: 1.1rem">
              Sistem Keamanan
            </h3>
            <p style="font-size: 0.75rem; color: #64748b">
              Masukkan username & PIN digital lock
            </p>
          </div>

          <!-- Input Username -->
          <div style="margin-bottom: 12px">
            <label
              style="
                font-size: 0.7rem;
                font-weight: bold;
                color: #475569;
                display: block;
                margin-bottom: 4px;
              "
              >USERNAME</label
            >
            <input
              type="text"
              id="username"
              placeholder="Masukkan Username"
              style="text-align: center; font-weight: bold"
            />
          </div>

          <!-- Panel Digital Door Lock (PIN / Password) -->
          <div style="margin-bottom: 15px">
            <label
              style="
                font-size: 0.7rem;
                font-weight: bold;
                color: #475569;
                display: block;
                margin-bottom: 4px;
              "
              >DIGITAL LOCK PIN</label
            >

            <!-- Layar Tampilan PIN -->
            <div
              id="lockScreenDisplay"
              style="
                background: #0f172a;
                color: #00ffcc;
                font-family: &quot;JetBrains Mono&quot;, monospace;
                font-size: 1.1rem;
                text-align: center;
                padding: 10px;
                border-radius: 6px;
                letter-spacing: 4px;
                margin-bottom: 8px;
                min-height: 20px;
                border: 1px solid #334155;
              "
            >
              ____
            </div>

            <!-- Input Tersembunyi Password -->
            <input type="password" id="password" style="display: none" />

            <!-- Keypad Digital Lock -->
            <div
              style="
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
              "
            >
              <button type="button" class="lock-key" onclick="pressKey('1')">
                1
              </button>
              <button type="button" class="lock-key" onclick="pressKey('2')">
                2
              </button>
              <button type="button" class="lock-key" onclick="pressKey('3')">
                3
              </button>
              <button type="button" class="lock-key" onclick="pressKey('4')">
                4
              </button>
              <button type="button" class="lock-key" onclick="pressKey('5')">
                5
              </button>
              <button type="button" class="lock-key" onclick="pressKey('6')">
                6
              </button>
              <button type="button" class="lock-key" onclick="pressKey('7')">
                7
              </button>
              <button type="button" class="lock-key" onclick="pressKey('8')">
                8
              </button>
              <button type="button" class="lock-key" onclick="pressKey('9')">
                9
              </button>
              <button
                type="button"
                class="lock-key"
                onclick="clearLock()"
                style="
                  background: #fee2e2;
                  color: #dc2626;
                  font-size: 0.75rem;
                  border-color: #fecaca;
                "
              >
                C
              </button>
              <button type="button" class="lock-key" onclick="pressKey('0')">
                0
              </button>
              <button
                type="button"
                class="lock-key"
                onclick="backspaceLock()"
                style="
                  background: #fef3c7;
                  color: #d97706;
                  font-size: 0.75rem;
                  border-color: #fde68a;
                "
              >
                <i class="fa-solid fa-delete-left"></i>
              </button>
            </div>
          </div>

          <!-- Tombol Eksekusi Login -->
          <button
            onclick="loginSystem()"
            style="font-weight: bold; letter-spacing: 0.5px"
          >
            <i class="fa-solid fa-lock-open"></i> BUKA SISTEM
          </button>
        </div>
      </div>
    </div>

    <!-- Modal global untuk form/dialog -->
    <div class="m-ov" id="modalOv">
      <div class="m-box" id="modalBox">
        <div class="m-hd">
          <h3 id="modalTitle">Form</h3>
          <button type="button" class="m-x" id="modalClose">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="m-bd" id="modalBody"></div>
        <div class="m-ft" id="modalFoot"></div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="db_pbukuan.js"></script>
    <script src="app_core.js"></script>
    <script src="app_perkiraan.js"></script>
    <script src="app_mutasi.js"></script>
    <script src="app_laporan_kas.js"></script>
    <script src="app_posting.js"></script>
    <script src="app_laporan.js"></script>
    <script src="app_laporan_gab.js"></script>
    <script src="app_laporan_sales.js"></script>
    <script src="app_utility.js"></script>
    <script src="app_user.js"></script>
    <script src="app_impor_foxpro.js"></script>
    <script src="app_login.js"></script>
    <script src="app_init.js"></script>
  </body>
</html>
